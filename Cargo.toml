[package]
name = "rustx"
version = "1.1.0"
edition = "2021"
build = "build.rs"
description = "rustx - Minecraft launcher (Vanilla, Fabric, Forge, Quilt, Ely.by)"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
md5 = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
winresource = "0.1"
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "rustx"
path = "main.rs"
